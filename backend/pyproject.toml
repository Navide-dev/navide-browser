# The Navide Browser backend's own environment. browser_backend.py uses the
# Python standard library only; this project exists to pin the toolchain that
# packages it (scripts/build-backend.mjs), independently of the Navide
# repository's backend.
[project]
name = "navide-browser-backend"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
build = ["pyinstaller==6.22.3"]

[tool.uv]
package = false
default-groups = ["build"]
